name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "msi,nsis"
          - os: macos-latest
            bundles: "dmg,app"
          - os: ubuntu-22.04
            bundles: "deb,appimage"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 xdg-utils

      - name: Install Tauri CLI (fast prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Generate App Icons
        shell: bash
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; Image.new('RGBA',(1024,1024),(16,185,129,255)).save('app-icon.png')"
          cargo tauri icon app-icon.png

      - name: Build Tauri Bundles (${{ matrix.os }})
        shell: bash
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: List generated bundles (debug check)
        shell: bash
        run: |
          find target/release/bundle -maxdepth 3 || true
          find src-tauri/target/release/bundle -maxdepth 3 || true

      - name: Upload Release Installers
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Research to Jupyter ${{ github.ref_name }}"
          body: |
            Cross-platform installers for **Research to Jupyter ${{ github.ref_name }}**:
            - **Windows:** `.msi` or `-setup.exe`
            - **macOS:** `.dmg`
            - **Linux:** `.deb` or `.AppImage`
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage