name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: Install Tauri CLI, Pillow, and generate icons
        shell: bash
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked
          python -m pip install --upgrade pip
          python -m pip install pillow
          python -c "from PIL import Image; Image.new('RGBA',(1024,1024),(16,185,129,255)).save('app-icon.png')"
          cargo tauri icon app-icon.png

      - name: Build the desktop app
        shell: bash
        run: cargo tauri build

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Research to Jupyter ${{ github.ref_name }}"
          body: |
            Cross-platform build of Research to Jupyter.

            See the README for installation instructions.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}